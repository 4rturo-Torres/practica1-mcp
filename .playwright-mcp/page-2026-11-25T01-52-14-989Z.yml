      - generic "Anexo:Entidades federativas de México por superficie, población y densidad" [ref=e88]:
        - generic [ref=e91]:
          - generic [ref=e92]:
            - paragraph [ref=e93]:
              - text: El nombre oficial de
              - link "México" [ref=e94] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/México
              - text: es Estados Unidos Mexicanos y está formado por 32
              - link "entidades federativas" [ref=e95] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/Organización_territorial_de_México
              - text: ", una de ellas es la"
              - link "Ciudad de México" [ref=e96] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/Ciudad_de_México
              - text: donde se encuentran los poderes de la Nación por ser la capital del país.
            - paragraph [ref=e97]:
              - text: La extensión y los límites de cada estado son fijados por las leyes particulares de la materia y las constituciones de cada una de las entidades del país. Las controversias limítrofes son dirimidas por la
              - link "Suprema Corte de Justicia de la Nación" [ref=e98] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/Suprema_Corte_de_Justicia_de_la_Nación_(México)
              - text: .
            - paragraph [ref=e99]:
              - text: La división territorial de México aún refleja en gran parte la división política en Intendencias que fue implementada por el Rey
              - link "Carlos III de España" [ref=e100] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/Carlos_III_de_España
              - text: como parte de una serie de reformas llevadas a cabo para el Virreinato de la
              - link "Nueva España" [ref=e101] [cursor=pointer]:
                - /url: https://es.wikipedia.org/wiki/Nueva_España
              - text: a finales del siglo XVIII. Además refleja la distribución de la población, pues los estados del centro y sur del país, al ser los más poblados, son más numerosos y pequeños, mientras que en el norte, donde la población era más escasa, los estados son menos y con una mucho mayor extensión territorial. Las entidades con mayor densidad se localizan en el centro del país —estados de México, San Luis Potosí, Tlaxcala y Ciudad de México— y los de menor densidad en el norte (excepto Campeche que está en el sureste).
